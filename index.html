<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e4a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Maze Runner - a 2D platformer made with Unity, playable in your browser.">
  <!-- Home Screen / standalone mode (the supported way to get a full-screen game on iPhone). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maze Runner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
  <link rel="icon" type="image/png" href="TemplateData/icon-192.png">
  <title>Maze Runner</title>
  <!-- Portfolio typefaces; loaded without blocking the game (system fonts until ready). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-title">Maze Runner</div>
      <div id="loading-track"><div id="loading-fill"></div></div>
      <div id="loading-text">Loading 0%</div>
    </div>
  </div>

  <!-- On-screen controls (touch devices only). -->
  <div id="touch-controls">
    <div id="joystick" aria-label="Movement joystick">
      <div class="joy-base">
        <span class="joy-arrow joy-arrow-left"></span>
        <span class="joy-arrow joy-arrow-right"></span>
        <div class="joy-thumb"></div>
      </div>
    </div>
    <button id="btn-jump" class="ctrl" type="button" aria-label="Jump">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
      <span>JUMP</span>
    </button>
  </div>

  <div id="top-controls" role="toolbar" aria-label="Game controls">
    <button id="btn-pause" class="chip" type="button" aria-label="Pause" title="Pause (Esc)" hidden>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.2" height="14"/><rect x="13.8" y="5" width="3.2" height="14"/></svg>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="btn-fullscreen" class="chip" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen (F)">
      <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
  </div>

  <div id="rotate-hint" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 14a9 9 0 0 0 7 7M21 10a9 9 0 0 0-7-7"/></svg>
    <span>Rotate for the full view</span>
    <button type="button" aria-label="Dismiss">&times;</button>
  </div>

  <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <div id="sheet-title" class="sheet-title">Play full screen</div>
      <div id="sheet-body" class="sheet-body"></div>
      <button id="sheet-close" type="button">OK</button>
    </div>
  </div>

  <div id="safe-probe" aria-hidden="true"></div>
  <div id="error" hidden></div>

  <script>
  (function () {
    "use strict";

    // The game renders 1080 px tall - the height its Constant Pixel Size UI was laid
    // out for - at the window's own aspect ratio, clamped to MIN..MAX. Every camera
    // is orthographic with a fixed vertical size, so a wider canvas shows more of the
    // level sideways instead of stretching anything. Only windows narrower than 16:9
    // or wider than 2.4:1 get (thin) bars.
    var GAME_H = 1080, MIN_ASPECT = 16 / 9, MAX_ASPECT = 2.4;

    var root = document.documentElement;
    var body = document.body;
    var canvas = document.getElementById("unity-canvas");
    var stage = document.getElementById("stage");
    var probe = document.getElementById("safe-probe");

    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isTouch = isIOS || window.matchMedia("(pointer: coarse)").matches;
    var isStandalone = navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;

    body.classList.toggle("touch", isTouch);
    body.classList.toggle("standalone", isStandalone);


    // ------------------------------------------------------------------ layout
    function safeInsets() {
      var cs = getComputedStyle(probe);
      return {
        top: parseFloat(cs.paddingTop) || 0,
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0
      };
    }

    function viewportSize() {
      // innerWidth/innerHeight track the visible area on iOS Safari as its
      // toolbars collapse and expand; visualViewport is the more precise source.
      var vv = window.visualViewport;
      var w = vv ? Math.round(vv.width) : window.innerWidth;
      var h = vv ? Math.round(vv.height) : window.innerHeight;
      return { w: Math.min(w, window.innerWidth) || w, h: Math.min(h, window.innerHeight) || h };
    }

    function layout() {
      var vp = viewportSize();
      var inset = safeInsets();
      var portrait = vp.h > vp.w;
      body.classList.toggle("portrait", portrait);
      body.classList.toggle("landscape", !portrait);
      root.style.setProperty("--vh", vp.h + "px");

      // Area the game may occupy. Phones in landscape run edge to edge (no side
      // bars); the safe-area insets are passed to Unity instead, which keeps its
      // edge-anchored HUD (the hearts) clear of the notch. Portrait keeps the game
      // inside the safe area.
      var left = isTouch && portrait ? inset.left : 0;
      var right = isTouch && portrait ? inset.right : 0;
      var top = isTouch && portrait ? inset.top + 6 : 0;
      var availW = vp.w - left - right;
      var availH = vp.h - top;

      var aspect = Math.min(MAX_ASPECT, Math.max(MIN_ASPECT, availW / availH));
      var w, h;
      if (availW / availH > aspect) { h = availH; w = Math.round(h * aspect); }
      else { w = availW; h = Math.round(w / aspect); }

      // Render size follows the aspect ratio; Unity picks up the new canvas size.
      var renderW = Math.round(GAME_H * aspect);
      if (canvas.width !== renderW || canvas.height !== GAME_H) {
        canvas.width = renderW;
        canvas.height = GAME_H;
      }

      var x = Math.round(left + (availW - w) / 2);
      var y = Math.round((vp.h - h) / 2);
      if (isTouch && portrait) {
        // Center the game in the space above the controls, leaving a row
        // below it for the hint / pause / fullscreen chips.
        var controlsTop = joyBase.getBoundingClientRect().top || vp.h * 0.7;
        var room = controlsTop - top - 16 - (h + 56);
        y = Math.round(top + Math.max(0, room / 2));
      }

      stage.style.width = w + "px";
      stage.style.height = h + "px";
      stage.style.transform = "translate(" + x + "px," + y + "px)";
      root.style.setProperty("--stage-x", x + "px");
      root.style.setProperty("--stage-y", y + "px");
      root.style.setProperty("--stage-w", w + "px");
      root.style.setProperty("--stage-h", h + "px");
      root.style.setProperty("--stage-bottom", (y + h) + "px");
      root.style.setProperty("--stage-right", (vp.w - x - w) + "px");
      updateRotateHint();

      // How far the device's safe area cuts into the game, in render pixels.
      var px = canvas.width / w;
      sendSafeArea([
        Math.max(0, inset.left - x),
        Math.max(0, inset.top - y),
        Math.max(0, (x + w) - (vp.w - inset.right)),
        Math.max(0, (y + h) - (vp.h - inset.bottom))
      ].map(function (v) { return Math.round(v * px); }).join(","));
    }

    // Unity side: WebBridge.SetSafeArea("left,top,right,bottom"), sent when it changes.
    var lastSafeArea = "";
    function sendSafeArea(value) {
      if (value === lastSafeArea || !window.unityInstance) return;
      lastSafeArea = value;
      try { window.unityInstance.SendMessage("WebBridge", "SetSafeArea", value); } catch (e) { /* bridge optional */ }
    }

    var layoutTimer = 0;
    function scheduleLayout() {
      layout();
      // iOS reports the final viewport size a little after rotation / toolbar changes.
      clearTimeout(layoutTimer);
      layoutTimer = setTimeout(layout, 350);
    }
    window.addEventListener("resize", scheduleLayout);
    window.addEventListener("orientationchange", scheduleLayout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleLayout);

    // ------------------------------------------------- input bridge (keyboard)
    // The game reads its existing Input System actions (Move: A/D/arrows,
    // Jump: Space, Pause: Escape). On-screen controls emit the same key
    // transitions - one keydown when a control engages, one keyup when it
    // releases - so gameplay code, physics and input bindings stay unchanged.
    var KEYS = {
      ArrowLeft:  { key: "ArrowLeft",  keyCode: 37 },
      ArrowRight: { key: "ArrowRight", keyCode: 39 },
      Space:      { key: " ",          keyCode: 32 },
      Escape:     { key: "Escape",     keyCode: 27 }
    };
    var held = {};

    function sendKey(type, code) {
      var k = KEYS[code];
      var ev = new KeyboardEvent(type, {
        key: k.key, code: code, keyCode: k.keyCode, which: k.keyCode,
        bubbles: true, cancelable: true
      });
      // Some engines ignore keyCode/which in the constructor; make sure they are set.
      if (ev.keyCode !== k.keyCode) {
        try {
          Object.defineProperty(ev, "keyCode", { get: function () { return k.keyCode; } });
          Object.defineProperty(ev, "which", { get: function () { return k.keyCode; } });
        } catch (e) { /* ignore */ }
      }
      canvas.dispatchEvent(ev);
    }
    function press(code) { if (!held[code]) { held[code] = true; sendKey("keydown", code); } }
    function release(code) { if (held[code]) { held[code] = false; sendKey("keyup", code); } }
    function tap(code) { press(code); setTimeout(function () { release(code); }, 60); }

    // ----------------------------------------------------------------- joystick
    var joyZone = document.getElementById("joystick");
    var joyBase = joyZone.querySelector(".joy-base");
    var joyThumb = joyZone.querySelector(".joy-thumb");
    var joy = { id: null, cx: 0, cy: 0, travel: 0, dir: 0 };
    var ENGAGE = 0.32, DISENGAGE = 0.2; // fraction of travel, with hysteresis

    function setDir(dir) {
      if (dir === joy.dir) return;
      if (joy.dir === -1) release("ArrowLeft");
      if (joy.dir === 1) release("ArrowRight");
      joy.dir = dir;
      if (dir === -1) press("ArrowLeft");
      if (dir === 1) press("ArrowRight");
      joyZone.setAttribute("data-dir", dir === -1 ? "left" : dir === 1 ? "right" : "");
    }

    function moveJoy(e) {
      var dx = e.clientX - joy.cx, dy = e.clientY - joy.cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > joy.travel) { dx *= joy.travel / dist; dy *= joy.travel / dist; }
      joyThumb.style.transform = "translate(" + dx + "px," + dy + "px)";
      var nx = joy.travel ? dx / joy.travel : 0;
      var dir = joy.dir;
      if (nx >= ENGAGE) dir = 1;
      else if (nx <= -ENGAGE) dir = -1;
      else if (Math.abs(nx) < DISENGAGE) dir = 0;
      setDir(dir);
    }

    function endJoy() {
      joy.id = null;
      joyZone.classList.remove("active");
      joyThumb.style.transform = "";
      setDir(0);
    }

    joyZone.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (joy.id !== null) return; // another finger already owns the stick
      joy.id = e.pointerId;
      try { joyZone.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
      var r = joyBase.getBoundingClientRect();
      joy.cx = r.left + r.width / 2;
      joy.cy = r.top + r.height / 2;
      joy.travel = r.width * 0.3;
      joyZone.classList.add("active");
      moveJoy(e);
    });
    joyZone.addEventListener("pointermove", function (e) {
      if (e.pointerId !== joy.id) return;
      e.preventDefault();
      moveJoy(e);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (type) {
      joyZone.addEventListener(type, function (e) {
        if (e.pointerId === joy.id) endJoy();
      });
    });

    // --------------------------------------------------------------------- jump
    var jumpBtn = document.getElementById("btn-jump");
    var jumpId = null;
    jumpBtn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (jumpId !== null) return;
      jumpId = e.pointerId;
      try { jumpBtn.setPointerCapture(e.pointerId); } catch (err) { /* optional */ }
      jumpBtn.classList.add("down");
      press("Space"); // one keydown per touch; holding = higher jump, as on keyboard
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (type) {
      jumpBtn.addEventListener(type, function (e) {
        if (e.pointerId !== jumpId) return;
        jumpId = null;
        jumpBtn.classList.remove("down");
        release("Space");
      });
    });

    function releaseAll() {
      if (joy.id !== null) endJoy();
      if (jumpId !== null) { jumpId = null; jumpBtn.classList.remove("down"); }
      Object.keys(held).forEach(release);
    }
    window.addEventListener("blur", releaseAll);
    document.addEventListener("visibilitychange", function () { if (document.hidden) releaseAll(); });

    // -------------------------------------------------------------------- pause
    // The button drives the game's own pause menu through WebBridge (Unity side),
    // which also reports the real state back, so the button never opens a second
    // overlay and always shows whether the game is paused.
    var pauseBtn = document.getElementById("btn-pause");
    var gameState = "none";
    window.mazeRunnerOnState = function (state) {
      gameState = state;
      body.setAttribute("data-game", state);
      // The joystick and Jump button only show while playing (see style.css); let go of
      // anything they were holding the moment play stops, so no key stays pressed.
      if (state !== "playing") releaseAll();
      pauseBtn.hidden = state === "none";
      pauseBtn.disabled = state === "blocked";
      var paused = state === "paused";
      pauseBtn.classList.toggle("is-paused", paused);
      pauseBtn.setAttribute("aria-label", paused ? "Resume" : "Pause");
      pauseBtn.title = paused ? "Resume (Esc)" : "Pause (Esc)";
    };
    // Main menu Quit (via WebBridge.QuitToPreview / MazeRunner_Quit): a page cannot
    // close its own tab, so return to the preview page. That page loads no Unity
    // files, so the game is not started again until Play Now is clicked.
    window.mazeRunnerQuit = function () {
      releaseAll();
      window.location.assign(new URL("preview/", window.location.href).href);
    };

    pauseBtn.addEventListener("click", function () {
      if (window.unityInstance) {
        window.unityInstance.SendMessage("WebBridge", "TogglePause");
      } else {
        tap("Escape");
      }
      focusGame();
    });

    // --------------------------------------------- page gestures / focus
    // No scrolling, pinch-zoom or double-tap zoom while playing.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("touchmove", function (e) {
      if (!e.target.closest || !e.target.closest("#sheet")) e.preventDefault();
    }, { passive: false });
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      var onButton = e.target.closest && e.target.closest("button");
      if (!onButton && now - lastTouchEnd < 350) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest && e.target.closest("#touch-controls, #top-controls")) e.preventDefault();
    });

    // Desktop: let the control bar recede while the mouse is idle.
    var idleTimer = 0;
    function wake() {
      body.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { body.classList.add("idle"); }, 2500);
    }
    if (!isTouch) {
      window.addEventListener("mousemove", wake, { passive: true });
      wake();
    }

    function focusGame() {
      try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); }
    }
    canvas.addEventListener("pointerdown", focusGame);

    // --------------------------------------------------------------- fullscreen
    var fsBtn = document.getElementById("btn-fullscreen");
    var fsTarget = root; // whole page, so the touch controls stay visible

    function fsSupported() {
      return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
        !!(fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen);
    }
    function fsActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function onFullscreenChange() {
      var active = fsActive();
      body.classList.toggle("is-fullscreen", active);
      fsBtn.setAttribute("aria-pressed", active ? "true" : "false");
      fsBtn.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      scheduleLayout();
    }
    document.addEventListener("fullscreenchange", onFullscreenChange);
    document.addEventListener("webkitfullscreenchange", onFullscreenChange);

    function lockLandscape() {
      // Only where the Screen Orientation API allows it (e.g. Android Chrome in fullscreen).
      if (isTouch && screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function () { /* unsupported: ignore */ });
      }
    }

    function enterFullscreen() {
      var result;
      try {
        result = fsTarget.requestFullscreen
          ? fsTarget.requestFullscreen({ navigationUI: "hide" })
          : fsTarget.webkitRequestFullscreen();
      } catch (err) {
        showFullscreenHelp();
        return;
      }
      if (result && typeof result.then === "function") {
        result.then(lockLandscape, function (err) {
          // Desktop browsers reject only for transient reasons (e.g. no user gesture);
          // the help sheet is for devices that cannot go full screen at all.
          if (isTouch) showFullscreenHelp(); else console.warn("Fullscreen request was rejected:", err);
        });
      } else {
        setTimeout(lockLandscape, 300);
      }
    }
    function exitFullscreen() {
      var result = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen();
      if (result && typeof result.catch === "function") result.catch(function () { /* ignore */ });
    }

    function toggleFullscreen() {
      if (fsSupported()) {
        if (fsActive()) exitFullscreen(); else enterFullscreen();
      } else {
        showFullscreenHelp();
      }
      focusGame();
    }
    fsBtn.addEventListener("click", toggleFullscreen);

    // F toggles fullscreen (Esc keeps the browser's own exit). Ignored while typing,
    // with modifier keys, or on key repeat while held.
    window.addEventListener("keydown", function (e) {
      if (e.code !== "KeyF" && e.key !== "f" && e.key !== "F") return;
      if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (!sheet.hidden) return;
      e.preventDefault();
      toggleFullscreen();
    }, true);

    // -------------------------------------------- fallback help (iPhone etc.)
    var sheet = document.getElementById("sheet");
    var sheetBody = document.getElementById("sheet-body");
    function showFullscreenHelp() {
      releaseAll();
      if (isIOS) {
        sheetBody.innerHTML =
          "<p>Safari on iPhone does not allow web pages to go full screen. " +
          "To play without the browser bars, add the game to your Home Screen:</p>" +
          "<ol><li>Tap <b>Share</b> " +
          "<svg class='inline-icon' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7'/></svg>" +
          " in the browser toolbar.</li>" +
          "<li>Choose <b>Add to Home Screen</b>.</li>" +
          "<li>Open <b>Maze Runner</b> from your Home Screen and turn your phone sideways.</li></ol>" +
          "<p class='sheet-note'>Progress saved in the Home Screen app is kept separately from Safari.</p>";
      } else {
        sheetBody.innerHTML =
          "<p>This browser does not support full screen for web pages. " +
          "Turn your device sideways for the largest view, or use your browser's menu to install or add the game to your home screen.</p>";
      }
      sheet.hidden = false;
    }
    document.getElementById("sheet-close").addEventListener("click", function () {
      sheet.hidden = true;
      focusGame();
    });
    sheet.addEventListener("click", function (e) { if (e.target === sheet) { sheet.hidden = true; focusGame(); } });

    // ------------------------------------------------------------- rotate hint
    var hint = document.getElementById("rotate-hint");
    var hintDismissed = false;
    try { hintDismissed = localStorage.getItem("mr-rotate-hint") === "1"; } catch (e) { /* ignore */ }
    function updateRotateHint() {
      hint.hidden = !(isTouch && body.classList.contains("portrait") && !hintDismissed);
    }
    hint.querySelector("button").addEventListener("click", function () {
      hintDismissed = true;
      try { localStorage.setItem("mr-rotate-hint", "1"); } catch (e) { /* ignore */ }
      updateRotateHint();
    });

    layout();

    // ------------------------------------------------------------ unity loader
    function showError(msg) {
      var box = document.getElementById("error");
      box.textContent = msg;
      box.hidden = false;
    }

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/91d96be662b401fd1438ad3a5cd64662.data.unityweb",
      frameworkUrl: buildUrl + "/f2ee019a572c659ceb4204358315486d.framework.js.unityweb",
      codeUrl: buildUrl + "/000f29f37b7553ea4f3c8dccba27f87d.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "maze-runner",
      productVersion: "1.0",
      matchWebGLToCanvasSize: false,
      showBanner: function (msg, type) {
        if (type === "error") showError(msg);
        else console.warn(msg);
      }
    };

    var fill = document.getElementById("loading-fill");
    var loadingText = document.getElementById("loading-text");
    var script = document.createElement("script");
    script.src = buildUrl + "/d977cf002be6ffd7142fbcc49ec19d94.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        fill.style.width = pct + "%";
        loadingText.textContent = "Loading " + pct + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        try { sessionStorage.removeItem("mr-reloaded"); } catch (e) { /* ignore */ }
        try { instance.SendMessage("WebBridge", "RequestState"); } catch (e) { /* bridge optional */ }
        lastSafeArea = "";
        layout();
        body.classList.add("ready");
        focusGame();
      }).catch(function (message) {
        // A page cached from an earlier deploy can ask for build files that no longer
        // exist. Reload once (the browser revalidates the page) before reporting it.
        var reloaded = false;
        try { reloaded = sessionStorage.getItem("mr-reloaded") === "1"; } catch (e) { /* ignore */ }
        if (!reloaded) {
          try { sessionStorage.setItem("mr-reloaded", "1"); } catch (e) { /* ignore */ }
          window.location.reload();
          return;
        }
        showError(String(message));
      });
    };
    script.onerror = function () {
      var reloaded = false;
      try { reloaded = sessionStorage.getItem("mr-reloaded") === "1"; } catch (e) { /* ignore */ }
      if (!reloaded) {
        try { sessionStorage.setItem("mr-reloaded", "1"); } catch (e) { /* ignore */ }
        window.location.reload();
        return;
      }
      showError("Failed to load the game files. Please refresh the page.");
    };
    body.appendChild(script);
  })();
  </script>
</body>
</html>
